apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-qa-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-qa-backend
  template:
    metadata:
      labels:
        app: ai-qa-backend
    spec:
      containers:
        - name: backend
          image: ai-qa-backend:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-qa-backend-svc
spec:
  selector:
    app: ai-qa-backend
  ports:
    - port: 80
      targetPort: 8000
